#
# gitleaks, as the export's audit runs it before each snapshot and as anyone can run it here:
#   gitleaks detect --no-git --source . --config .gitleaks.toml --redact
[extend]
useDefault = true

[allowlist]
description = "The examples' receipt and the demo dossier hold compact JWS signatures (the receipt, signature.jws) and public keys. A signature is not a secret — anyone holding the evidence holds it — and the demo key that made them was generated in memory, its private half never written."
paths = [
  '''examples/receipt\.txt$''',
  '''examples/demo-dossier\.zip$''',
]
# Two test identifiers the generic rule reads as keys because a « token » stands beside them (test/checks.test.mjs
# `byId(tokenless, 'compliance.root.4')`, test/headroot.test.mjs `token: 'head-root.20261121T10Z.tsr'`): a check's id
# and the file name of a dossier's timestamp token — never a credential. Matched on the value, its exact shape only.
regexes = [
  '''^compliance\.[a-z]+\.[0-9]+$''',
  '''^head-root\.[0-9]{8}T[0-9]{2}Z\.tsr$''',
]
