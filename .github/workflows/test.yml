#
# The verifier's own tests, on every push and pull request: the examples verify, one byte
# changed fails, and the web page is exactly what the sources build. Nothing to install.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['18', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: node --test
      - name: The web page is what the sources build
        run: node scripts/build-web.mjs --check
